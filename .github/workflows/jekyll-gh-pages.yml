# Builds the website of this repository and deploys it to GitHub Pages:
#
#   <site>/            index.md of this folder (site-index.md)
#   <site>/glossary/   the glossary page (glossary/index.md)
#   <site>/cloud/      the tool and method catalog (cloud/docs/)
#
# The site is rebuilt after each push to main, and after the workflows that commit generated files, as their
# commits do not start workflows themselves.
name: Deploy the website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["extract-owl", "Generate material (R version)", "Collect Service Meta-Data for CAP",
                "Generate Method Documentation with Mustache", "Generate Method Markdown Index"]
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p site/glossary site/cloud
          cp site-index.md site/index.md
          cp glossary/index.md site/glossary/index.md
          cp glossary/glossary.owl site/glossary/glossary.owl
          cp -r cloud/docs/. site/cloud/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site/
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
