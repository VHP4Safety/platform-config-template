name: Cleanup VXP Identifier

on:
  issues:
    types: [closed]

# The files of this workflow are in glossary/.
defaults:
  run:
    working-directory: glossary

jobs:
  cleanup-id:
    if: contains(github.event.issue.title, '[TERM REQUEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch VXP cache from vxp-state branch
        run: |
          # all branches, so IDs used in open branches are taken into account
          git fetch --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin vxp-state
          git checkout origin/vxp-state -- .vxp-cache || echo "No cache found"

      - name: Extract VXP ID from issue comments
        id: extract-id
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            let vxpId = null;
            for (const comment of comments.data) {
              const match = comment.body.match(/VXP Identifier Assigned.*`(VXP\d{7})`/);
              if (match) {
                vxpId = match[1];
                break;
              }
            }

            return vxpId;
          result-encoding: string

      - name: Cleanup unused VXP ID
        if: steps.extract-id.outputs.result != 'null'
        run: python scripts/cleanup_id.py '${{ steps.extract-id.outputs.result }}'

      - name: Save updated VXP cache to branch
        if: steps.extract-id.outputs.result != 'null'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin vxp-state
          git checkout -b vxp-state origin/vxp-state || git checkout -b vxp-state
          git add .vxp-cache
          git commit -m "Cleaned up VXP ID [ci skip]" || echo "No changes to commit"
          git push origin vxp-state
