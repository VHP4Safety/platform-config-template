name: Assign VXP Identifier

on:
  issues:
    types: [opened]

# The files of this workflow are in glossary/.
defaults:
  run:
    working-directory: glossary

jobs:
  assign-id:
    if: contains(github.event.issue.title, '[TERM REQUEST]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch VXP cache from vxp-state branch
        run: |
          # all branches, so IDs used in open branches are taken into account
          git fetch --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin vxp-state
          git checkout origin/vxp-state -- .vxp-cache || echo "No cache found"

      - name: Extract and assign VXP ID
        id: assign-id
        run: python scripts/assign_id.py

      - name: Save updated VXP cache to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin vxp-state
          git checkout -b vxp-state origin/vxp-state || git checkout -b vxp-state
          git add .vxp-cache
          git commit -m "Update VXP cache after assignment [ci skip]" || echo "No changes to commit"
          git push origin vxp-state

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const vxpId = '${{ steps.assign-id.outputs.vxp_id }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🆔 **VXP Identifier Assigned:** \`${vxpId}\`\n\nThis identifier has been reserved for this term request.`
            });
